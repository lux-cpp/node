name: image

# The C++ node, as an image, for both architectures.
#
# This repository had no CI at all, so the C++ node has never been published —
# which is why the fleet could only ever run the Go one, and why spark's arm64
# cores carried no chain node.
#
# The Dockerfile builds from a context holding three checkouts side by side
# (this node, the consensus engine, and the luxcpp root that carries blst,
# cevm and zap-cpp-core), so the job assembles that context rather than the
# Dockerfile cloning private repositories at build time.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            pool: linux-amd64
          - arch: arm64
            pool: linux-arm64
    runs-on: ['${{ matrix.pool }}']
    timeout-minutes: 120
    steps:
      # One docker config per RUNNER: several runner services share this
      # machine’s HOME, and docker/login-action logs out in its post step,
      # so a job that finishes takes the credential from a job still
      # pushing. Set here rather than in the job env, where the runner
      # context does not exist and naming it is a syntax error.
      - name: One docker config per runner
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"
          echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { path: ctx/lux-cpp/node, submodules: recursive }
      - uses: actions/checkout@v4
        with: { repository: lux-cpp/consensus, path: ctx/lux-cpp/consensus, token: '${{ secrets.GH_PAT }}', submodules: recursive }
      # luxcpp is a ROOT, not a repository: the Dockerfile expects a directory
      # holding the C++ trees this node links. Checking out a repo of that name
      # fetched an unrelated Next.js app, and the build failed with the four
      # things it actually needs absent.
      - uses: actions/checkout@v4
        with:
          repository: lux-cpp/cevm
          path: ctx/luxcpp/cevm
          token: '${{ secrets.GH_PAT }}'
          # NAMED, because cevm's default branch is not the one this node is
          # known to work against. Its default is blue/gethdiff-ci, main is a
          # third line, and the tree that passes this node's 54 tests is this
          # one. An unnamed checkout builds whichever branch happens to be
          # default and says nothing about it.
          ref: precompile/p256-one-price
          # cevm carries evmc as a submodule and refuses to configure without
          # it — "Git submodules not initialized" from its own CMakeLists, which
          # is where this build stopped. checkout does not fetch them unless
          # asked, so every tree here asks.
          submodules: recursive
      - uses: actions/checkout@v4
        with: { repository: lux-cpp/zap-cpp-core, path: ctx/luxcpp/zap-cpp-core, token: '${{ secrets.GH_PAT }}', submodules: recursive }
      - uses: actions/checkout@v4
        with: { repository: lux-cpp/blst, path: ctx/luxcpp/blst, token: '${{ secrets.GH_PAT }}', submodules: recursive }
      - uses: actions/checkout@v4
        with: { repository: lux-cpp/crypto, path: ctx/luxcpp/crypto, token: '${{ secrets.GH_PAT }}', submodules: recursive }
      # The 0x100 precompile's 256-bit arithmetic. cevm refuses to configure
      # without it and says why: the header is the ONE canonical copy and a
      # forked one is a consensus split. It is named lux-private/gpu-kernels in
      # cevm's default path; the repository moved to lux-gpu, so the build is
      # told where the tree is rather than staged under a name that has moved.
      - uses: actions/checkout@v4
        with: { repository: lux-gpu/gpu-kernels, path: ctx/lux-private/gpu-kernels, token: '${{ secrets.GH_PAT }}', submodules: recursive }
      # The post-quantum crypto the handshake uses is a Go c-archive built from
      # this tree; the node links the .a and will not configure without it.
      - uses: actions/checkout@v4
        with: { repository: luxfi/crypto, path: ctx/lux/crypto, token: '${{ secrets.GH_PAT }}', submodules: recursive }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # One job per architecture, each on a runner of that architecture, so the
      # binary that ships for an arch was compiled by a native toolchain rather
      # than emulated. A C++ node under QEMU takes hours and proves less.
      - name: Build and push this architecture
        # The same credential the checkouts used, because lux-crypto's deps are
        # FetchContent clones of private forks and the configure step runs here.
        # As a secret it is readable only by the command that mounts it, so it
        # never lands in a layer or in `docker history`.
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          img=ghcr.io/lux-cpp/node
          docker build --secret id=gh_pat,env=GH_PAT \
            -f ctx/lux-cpp/node/Dockerfile -t "$img:${GITHUB_SHA::7}-${{ matrix.arch }}" ctx
          docker push "$img:${GITHUB_SHA::7}-${{ matrix.arch }}"
          # The builder stage as well, because a node that links this one has to
          # compile against it: libnode.a, the headers, and the consensus, cevm
          # and aws-lc trees it was built with. zooai/node builds zood on this
          # rather than assembling the same three checkouts a second time.
          docker build --secret id=gh_pat,env=GH_PAT \
            -f ctx/lux-cpp/node/Dockerfile --target builder \
            -t "$img:${GITHUB_SHA::7}-dev-${{ matrix.arch }}" ctx
          docker push "$img:${GITHUB_SHA::7}-dev-${{ matrix.arch }}"

  merge:
    needs: image
    runs-on: [linux-amd64]
    steps:
      # One docker config per RUNNER: several runner services share this
      # machine’s HOME, and docker/login-action logs out in its post step,
      # so a job that finishes takes the credential from a job still
      # pushing. Set here rather than in the job env, where the runner
      # context does not exist and naming it is a syntax error.
      - name: One docker config per runner
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"
          echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}
      # A manifest list with one entry pulls fine on the arch that built it and
      # fails everywhere else, so the release name is only ever written here,
      # from both.
      - name: One name, both architectures
        run: |
          set -euo pipefail
          img=ghcr.io/lux-cpp/node
          docker buildx imagetools create -t "$img:${GITHUB_SHA::7}" -t "$img:main" \
            "$img:${GITHUB_SHA::7}-amd64" "$img:${GITHUB_SHA::7}-arm64"
          docker buildx imagetools create -t "$img:${GITHUB_SHA::7}-dev" -t "$img:main-dev" \
            "$img:${GITHUB_SHA::7}-dev-amd64" "$img:${GITHUB_SHA::7}-dev-arm64"
          docker buildx imagetools inspect "$img:${GITHUB_SHA::7}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}'
